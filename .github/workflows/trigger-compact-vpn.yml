          p = Path('app/lib/widgets/compact_description.dart')
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text('''import 'package:flutter/material.dart';

class CompactDescription extends StatefulWidget {
  const CompactDescription({super.key, required this.child, this.maxLines = 1});
  final Widget child;
  final int maxLines;

  @override
  State<CompactDescription> createState() => _CompactDescriptionState();
}

class _CompactDescriptionState extends State<CompactDescription> {
  bool _expanded = false;

  @override
  Widget build(BuildContext context) {
    return AnimatedSize(
      duration: const Duration(milliseconds: 180),
      curve: Curves.easeOut,
      alignment: Alignment.topCenter,
      child: Row(
        crossAxisAlignment: CrossAxisAlignment.start,
        children: [
          Expanded(child: _expanded ? widget.child : _collapsed()),
          const SizedBox(width: 2),
          InkWell(
            borderRadius: BorderRadius.circular(16),
            onTap: () => setState(() => _expanded = !_expanded),
            child: Padding(
              padding: const EdgeInsets.all(4),
              child: Icon(_expanded ? Icons.expand_less : Icons.expand_more, size: 18),
            ),
          ),
        ],
      ),
    );
  }

  Widget _collapsed() {
    final child = widget.child;
    if (child is Text) {
      return Text(
        child.data ?? '',
        style: child.style,
        strutStyle: child.strutStyle,
        textAlign: child.textAlign,
        textDirection: child.textDirection,
        locale: child.locale,
        softWrap: false,
        overflow: TextOverflow.ellipsis,
        maxLines: widget.maxLines,
      );
    }
    return child;
  }
}
''', encoding='utf-8')

          s = Path('app/lib/screens/settings_screen.dart')
