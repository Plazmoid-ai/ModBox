name: Trigger compact VPN apply

on:
  push:
    branches:
      - mod/ui-compact-switch-descriptions-v2

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Run apply workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apply-compact-vpn.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
