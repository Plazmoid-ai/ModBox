name: Apply compact VPN descriptions

on:
  push:
    branches:
      - mod/ui-compact-switch-descriptions-v2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compact description widgets
        shell: bash
        run: |
          python3 - <<'PY'
