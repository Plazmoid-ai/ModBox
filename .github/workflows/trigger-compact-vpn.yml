              start = text.rfind('Text(', 0, pos)
              if start < 0:
                  continue
              end = text.find('),', pos)
              if end < 0:
                  continue
              # Find the end of this Text(...) including its style block when present.
              depth = 0
              i = start + 5
              in_str = False
              esc = False
              while i < len(text):
                  c = text[i]
                  if in_str:
                      if esc: esc = False
                      elif c == '\\': esc = True
                      elif c == '"': in_str = False
                  else:
