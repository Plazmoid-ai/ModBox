name: Refine compact description

on:
  push:
    branches:
      - mod/ui-compact-switch-descriptions-v2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply refinement
        run: python3 scripts/refine_compact_description.py
      - name: Commit and clean up
        run: |
          set -euo pipefail
          rm -f scripts/refine_compact_description.py .github/workflows/refine-compact-description.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/widgets/compact_description.dart app/lib/screens/vpn_mode_tab.dart
          git add -u scripts/refine_compact_description.py .github/workflows/refine-compact-description.yml
          git commit -m "ui: collapse descriptions exceeding three lines"
          git push origin HEAD:mod/ui-compact-switch-descriptions-v2
