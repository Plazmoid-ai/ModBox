name: Fix VPN compact text

on:
  push:
    branches:
      - mod/ui-compact-switch-descriptions-v2

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: python3 scripts/fix_vpn_compact_text.py
      - run: |
          rm -f scripts/fix_vpn_compact_text.py .github/workflows/fix-vpn-compact-text.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/screens/settings_screen.dart
          git add -u scripts/fix_vpn_compact_text.py .github/workflows/fix-vpn-compact-text.yml
          git commit -m "ui: preserve full idle tunnel description"
          git push origin HEAD:mod/ui-compact-switch-descriptions-v2
