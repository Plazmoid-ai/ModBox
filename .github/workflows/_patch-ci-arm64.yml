name: Apply ARM64 CI patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'ci: apply ARM64-only CI patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch CI workflow
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('.github/workflows/ci.yml')
          s = p.read_text(encoding='utf-8')

          new_android = r'''      - name: Build APK (ARM64 only)
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/app/outputs/flutter-apk
          CODE=$(../scripts/version-code.sh "$CODE_VERSION" arm64-v8a)
          echo "::group::Build arm64-v8a (versionCode=$CODE)"
          LXBOX_ABI_FILTER=arm64-v8a \
            flutter build apk --release \
              --target-platform android-arm64 \
              --build-name "$VERSION_NAME" --build-number "$CODE"
          mv "$OUT/app-release.apk" "$OUT/app-arm64-v8a-release.apk"
          echo "::endgroup::"
          ls -lh "$OUT/app-arm64-v8a-release.apk"

      - name: Upload APK (release)
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-release
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 1 || 30 }}
'''

          pattern = r'(?ms)^      - name: Build APKs \(one run per target\)\n.*?(?=^  release:)'
          if not re.search(pattern, s):
              raise SystemExit('Build/APK/AAB block not found; refusing to modify ci.yml')
          s = re.sub(pattern, new_android + '\n  release:', s, count=1)

          old_prepare = r'''      - name: Prepare APKs
        # Renames per-ABI / universal files to LxBox-vX.Y.Z-<variant>.apk
        # для консистентности с прошлыми релизами (UpdateChecker парсит имя).
        run: |
          set -euo pipefail
          VERSION="${{ needs.meta.outputs.version }}"
          for VARIANT in arm64-v8a armeabi-v7a x86_64 universal; do
            SRC=$(find release-artifacts/ -name "app-${VARIANT}-release.apk" -type f | head -1)
            if [ -z "$SRC" ]; then
              echo "ERROR: APK for variant=$VARIANT not found!"
              exit 1
            fi
            cp "$SRC" "LxBox-${VERSION}-${VARIANT}.apk"
          done
          ls -la LxBox-*.apk
'''
          new_prepare = r'''      - name: Prepare APK
        run: |
          set -euo pipefail
          VERSION="${{ needs.meta.outputs.version }}"
          SRC=$(find release-artifacts/ -name "app-arm64-v8a-release.apk" -type f | head -1)
          if [ -z "$SRC" ]; then
            echo "ERROR: ARM64 APK not found!"
            exit 1
          fi
          cp "$SRC" "LxBox-${VERSION}-arm64-v8a.apk"
          ls -la LxBox-*.apk
'''
          if old_prepare not in s:
              raise SystemExit('Prepare APKs block not found; refusing to modify ci.yml')
          s = s.replace(old_prepare, new_prepare, 1)

          old_files = '''          files: |
            LxBox-${{ needs.meta.outputs.version }}-arm64-v8a.apk
            LxBox-${{ needs.meta.outputs.version }}-armeabi-v7a.apk
            LxBox-${{ needs.meta.outputs.version }}-x86_64.apk
            LxBox-${{ needs.meta.outputs.version }}-universal.apk
'''
          new_files = '''          files: |
            LxBox-${{ needs.meta.outputs.version }}-arm64-v8a.apk
'''
          if old_files not in s:
              raise SystemExit('Release files list not found; refusing to modify ci.yml')
          s = s.replace(old_files, new_files, 1)

          manifest_pattern = r'(?ms)^      - name: Update docs/latest\.json\n.*?(?=^      - name: Commit & push \(main\))'
          manifest = r'''      - name: Update docs/latest.json
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          mkdir -p docs
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          cat > docs/latest.json <<EOF
          {
            "\$schema": "https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/latest.json",
            "tag": "${TAG}",
            "name": "L×Box ${VERSION}",
            "published_at": "${NOW}",
            "html_url": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}",
            "apk_url": "${BASE}/LxBox-${VERSION}-arm64-v8a.apk",
            "apk_urls": {
              "arm64-v8a": "${BASE}/LxBox-${VERSION}-arm64-v8a.apk"
            },
            "min_supported": "1.0.0",
            "_comment": "Updated automatically by CI on every release tag push. ARM64-v8a APK only."
          }
          EOF
          cat docs/latest.json

'''
          if not re.search(manifest_pattern, s):
              raise SystemExit('latest.json step not found; refusing to modify ci.yml')
          s = re.sub(manifest_pattern, manifest, s, count=1)

          p.write_text(s, encoding='utf-8')

      - name: Commit patched workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git diff --cached --check
          git diff --cached -- .github/workflows/ci.yml
          git commit -m "ci: build ARM64 APK only"
          git push origin HEAD:main
