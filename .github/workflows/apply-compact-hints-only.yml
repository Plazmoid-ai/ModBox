name: Apply compact hints to clean 2.24.4 branch

on:
  push:
    branches:
      - mod/back-ui-timer-2.24.4-clean

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply compact hint changes
        run: python3 scripts/apply_compact_hints_only.py
      - name: Commit and clean up
        run: |
          set -euo pipefail
          rm -f scripts/apply_compact_hints_only.py .github/workflows/apply-compact-hints-only.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/screens/app_settings_screen/widgets/compact_switch_list_tile.dart
          git add app/lib/screens/app_settings_screen/widgets/compact_description_list_tile.dart
          git add app/lib/widgets/compact_description.dart
          git add app/lib/screens/app_settings_screen/widgets/general_tab.dart
          git add app/lib/screens/app_settings_screen/widgets/diagnostics_tab.dart
          git add app/lib/screens/app_settings_screen/widgets/subscriptions_tab.dart
          git add app/lib/screens/settings_screen.dart
          git add app/lib/screens/vpn_mode_tab.dart
          git add app/lib/widgets/template_var_list.dart
          git add -u scripts/apply_compact_hints_only.py .github/workflows/apply-compact-hints-only.yml
          git commit -m "ui: restore compact expandable descriptions"
          git push origin HEAD:mod/back-ui-timer-2.24.4-clean
