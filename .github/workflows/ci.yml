# LxBox — CI/CD
#
# 1) Tag push (v*):            checks → ARM64 build → GitHub Release → manifest
# 2) push develop / main:      checks only
# 3) PR → develop / main:      checks only
# 4) workflow_dispatch:        checks | build | release

name: CI

on:
  push:
    branches: [main, develop]
    tags:
      - "v*"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_mode:
        description: "checks | build | release"
        required: true
        default: "checks"
        type: choice
        options: [checks, build, release]
      test_path:
        description: "Pinpoint run: test path relative to app/. Empty = full suite."
        required: false
        default: ""
        type: string
      test_name:
        description: "Optional --name filter for a pinpoint test run."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: Meta
    if: startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode != 'checks')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      is_release: ${{ steps.meta.outputs.is_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute version
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.inputs.run_mode }}" == "release" ]]; then
            if ! VERSION="$(git describe --tags --exact-match 2>/dev/null)"; then
              echo "::error::run_mode=release requires HEAD to be exactly on a vX.Y.Z tag." >&2
              exit 1
            fi
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            TAG="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
            if [ -n "$TAG" ]; then
              SINCE="$(git rev-list "${TAG}..HEAD" --count)"
              VERSION="${TAG#v}-dev.${SINCE}"
            else
              SHORT_SHA="$(git rev-parse --short=7 HEAD)"
              VERSION="dev-${SHORT_SHA}"
            fi
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Flutter version pin
        id: flutter_pin
        run: echo "version=$(tr -d '[:space:]' < android/flutter.version)" >> "$GITHUB_OUTPUT"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_pin.outputs.version }}
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        if: ${{ github.event.inputs.test_path == '' }}
        run: flutter analyze

      - name: Pubspec version is a placeholder (develop only)
        if: ${{ github.ref == 'refs/heads/develop' || github.base_ref == 'develop' }}
        run: |
          VERSION="$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/^version:[[:space:]]*//')"
          if [ -z "$VERSION" ]; then
            echo "::error file=app/pubspec.yaml::Could not read version from pubspec.yaml."
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -qE '(-dev\.[0-9]+|^0\.0\.0(\+|$))'; then
            echo "::error file=app/pubspec.yaml::develop contains a real release version '$VERSION'."
            exit 1
          fi

      - name: L10n checks
        if: ${{ github.event.inputs.test_path == '' }}
        run: |
          dart run tool/l10n/template_check.dart --strict
          dart run tool/l10n/ui_check.dart --strict
          dart run tool/l10n/hardcoded_check.dart --strict
          dart run tool/l10n/kotlin_check.dart --strict

      - name: Docs parity
        if: ${{ github.event.inputs.test_path == '' }}
        run: dart run tool/docs/parity_check.dart --strict

      - name: Contract lock
        if: ${{ github.event.inputs.test_path == '' }}
        run: dart run tool/check_contract_lock.dart

      - name: Test
        run: |
          TEST_PATH="${{ github.event.inputs.test_path }}"
          TEST_NAME="${{ github.event.inputs.test_name }}"
          if [ -n "$TEST_PATH" ]; then
            ARGS=(test -r expanded "$TEST_PATH")
            if [ -n "$TEST_NAME" ]; then
              ARGS+=(--name "$TEST_NAME")
            fi
            flutter "${ARGS[@]}"
          else
            flutter test
          fi

  android:
    if: startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode != 'checks')
    needs: [meta, checks]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch sing-box-lx core (libbox.aar)
        working-directory: .
        run: ./scripts/fetch-libbox.sh

      - name: Flutter version pin
        id: flutter_pin
        run: echo "version=$(tr -d '[:space:]' < android/flutter.version)" >> "$GITHUB_OUTPUT"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_pin.outputs.version }}
          cache: true

      - name: Inject release version from tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.meta.outputs.version }}"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VERSION="0.0.0-${VERSION}"
            CODE_VERSION="0.0.0"
          else
            CODE_VERSION="$VERSION"
          fi
          BUILD_NUMBER=$(../scripts/version-code.sh "$CODE_VERSION" universal)
          sed -i.bak -E "s/^version: .*/version: $VERSION+$BUILD_NUMBER/" pubspec.yaml
          rm -f pubspec.yaml.bak
          {
            echo "VERSION_NAME=$VERSION"
            echo "CODE_VERSION=$CODE_VERSION"
          } >> "$GITHUB_ENV"

      - name: Dependencies
        run: flutter pub get

      - name: Android release keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret; release APK will use debug signing."
            exit 0
          fi
          : "${ANDROID_KEYSTORE_PASSWORD:?Set ANDROID_KEYSTORE_PASSWORD when BASE64 is set}"
          : "${ANDROID_KEY_PASSWORD:?Set ANDROID_KEY_PASSWORD when BASE64 is set}"
          : "${ANDROID_KEY_ALIAS:?Set ANDROID_KEY_ALIAS when BASE64 is set}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Build APK (ARM64 only)
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/app/outputs/flutter-apk
          CODE=$(../scripts/version-code.sh "$CODE_VERSION" arm64-v8a)
          echo "::group::Build arm64-v8a (versionCode=$CODE)"
          LXBOX_ABI_FILTER=arm64-v8a \
            flutter build apk --release \
              --target-platform android-arm64 \
              --build-name "$VERSION_NAME" --build-number "$CODE"
          mv "$OUT/app-release.apk" "$OUT/app-arm64-v8a-release.apk"
          echo "::endgroup::"
          ls -lh "$OUT/app-arm64-v8a-release.apk"

      - name: Upload APK (release)
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-release
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 1 || 30 }}

  release:
    name: Create Release
    needs: [meta, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: needs.meta.outputs.is_release == 'true'
    steps:
      - name: Checkout (for release notes)
        uses: actions/checkout@v5
        with:
          sparse-checkout: RELEASE_NOTES.md
          sparse-checkout-cone-mode: false

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-arm64-release
          path: release-artifacts

      - name: Prepare APK
        run: |
          set -euo pipefail
          VERSION="${{ needs.meta.outputs.version }}"
          SRC=$(find release-artifacts/ -name "app-arm64-v8a-release.apk" -type f | head -1)
          if [ -z "$SRC" ]; then
            echo "ERROR: ARM64 APK not found!"
            exit 1
          fi
          cp "$SRC" "LxBox-${VERSION}-arm64-v8a.apk"
          ls -la LxBox-*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: LxBox ${{ needs.meta.outputs.version }}
          draft: false
          files: |
            LxBox-${{ needs.meta.outputs.version }}-arm64-v8a.apk
          body_path: RELEASE_NOTES.md

  publish-manifest:
    name: Publish docs/latest.json
    needs: [meta, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: needs.meta.outputs.is_release == 'true'
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update docs/latest.json
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          mkdir -p docs
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          cat > docs/latest.json <<EOF
          {
            "\$schema": "https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/latest.json",
            "tag": "${TAG}",
            "name": "L×Box ${VERSION}",
            "published_at": "${NOW}",
            "html_url": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}",
            "apk_url": "${BASE}/LxBox-${VERSION}-arm64-v8a.apk",
            "apk_urls": {
              "arm64-v8a": "${BASE}/LxBox-${VERSION}-arm64-v8a.apk"
            },
            "min_supported": "1.0.0",
            "_comment": "Updated automatically by CI on every release tag push. ARM64-v8a APK only."
          }
          EOF
          cat docs/latest.json

      - name: Commit & push (main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet docs/latest.json; then
            echo "No change in docs/latest.json — skipping commit."
            exit 0
          fi
          git add docs/latest.json
          git commit -m "chore(release): update docs/latest.json → ${{ needs.meta.outputs.tag }} [skip ci]"
          git push origin HEAD:main
